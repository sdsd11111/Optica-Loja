<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" width="100%" height="100%" fill="none">
  <!-- Ojo Estilizado Óptica Loja -->
  <g transform="translate(4, 2)">
    <!-- Arco superior del párpado -->
    <path d="M 4 28 C 12 12, 26 4, 42 4 C 58 4, 72 12, 80 28 C 76 26, 68 20, 42 20 C 18 20, 8 26, 4 28 Z" fill="#374151"/>
    <!-- Arco inferior fino -->
    <path d="M 10 33 C 20 44, 40 46, 52 44 C 64 42, 72 35, 76 30 C 72 36, 58 49, 42 49 C 24 49, 14 38, 10 33 Z" fill="#4b5563"/>
    <!-- Iris circular -->
    <circle cx="42" cy="27" r="13" fill="#374151"/>
    <!-- Pupila azul distintiva Óptica Loja -->
    <circle cx="42" cy="27" r="6" fill="#0284c7"/>
    <!-- Brillo de luz pupila -->
    <circle cx="44.5" cy="24.5" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Tipografía OPTICA -->
  <text x="88" y="38" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="31" fill="#374151" letter-spacing="-0.5">
    PTICA
  </text>
  
  <!-- Tipografía LOJA (Celeste distintivo con trazos finos/modernos) -->
  <text x="186" y="38" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="400" font-size="33" fill="#0ea5e9" letter-spacing="1">
    LOJA
  </text>

  <!-- Línea divisoria elegante -->
  <line x1="8" y1="49" x2="272" y2="49" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Eslogan oficial: ¡Lo mejor para tus ojos! -->
  <text x="270" y="61" text-anchor="end" font-family="'Inter', 'Montserrat', sans-serif" font-weight="500" font-size="10.5" fill="#6b7280" font-style="italic" letter-spacing="0.2">
    ¡Lo mejor para tus ojos!
  </text>
</svg>
